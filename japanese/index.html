<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#193f43"><title>旅途日文</title>
<style>
:root{--ink:#193f43;--muted:#5b6d72;--bg:#f2f6f6;--line:#d6e2e2;--accent:#a84a26}*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0;overscroll-behavior-y:none}body{min-height:100dvh;background:var(--bg);color:#20383d;font:16px/1.65 -apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}button,input,select,textarea{font:inherit}button,a,select,summary{touch-action:manipulation}button{cursor:pointer}a{color:#175d72}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #c15d2b;outline-offset:3px}
.primary{border:0;border-radius:8px;background:var(--ink);color:#fff;padding:9px 15px;font-weight:650}
select{display:block;width:100%;border:1px solid #b6c9cb;border-radius:6px;background:#fff;color:#20383d;padding:9px 10px;font-size:16px}
.jp-top{position:sticky;top:0;z-index:2;background:var(--ink);color:#fff}
.jp-top-row{display:flex;align-items:center;gap:6px;max-width:720px;margin:0 auto;padding:10px 14px 11px 6px}
.page-back{flex:0 0 44px;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;color:#fff}.page-back svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.page-back:focus-visible{outline:2px solid #fff;outline-offset:0}
h1{margin:0;font-size:21px;line-height:1.3}.jp-top-copy{flex:1;min-width:0}.jp-top-gear{flex:0 0 44px;display:grid;place-items:center;width:44px;height:44px;padding:0;border:1px solid #ffffff4d;border-radius:11px;background:#ffffff0d;color:#fff}.jp-top-gear svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.jp-top-gear:focus-visible{outline:2px solid #fff;outline-offset:2px}.jp-plan{margin:2px 0 0;font-size:13px;color:#cbe0df}
.jp-main{max-width:720px;margin:0 auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom))}
.jp-now{margin:0 0 6px;padding:11px 14px;border:1px solid #e8a08a;border-radius:12px;background:#fff0e9}.jp-now p{margin:0;font-size:15px;line-height:1.6}.jp-now span{display:inline-block;min-width:52px;font-weight:700;color:#8b3d1c}
.jp-group{margin-top:18px}.jp-group:first-child{margin-top:4px}.jp-group-title{margin:0 0 10px;font-size:15px;font-weight:700;color:var(--muted)}
.jp-cards{display:flex;flex-direction:column;gap:11px}
.jp-card{display:flex;align-items:center;gap:15px;width:100%;padding:10px 14px 10px 10px;text-align:left;border:1px solid var(--line);border-radius:13px;background:#fff;color:inherit;box-shadow:0 1px 2px #193f4305}.jp-card:hover{border-color:#92b5b8}.jp-card:active{background:#eaf2f2}
.jp-mark{flex:0 0 84px;width:84px;height:84px;display:grid;place-items:center;border-radius:10px;background:#e8f2f1;color:var(--ink);font-size:40px;font-weight:700;line-height:1}.jp-mark rt{font-size:12px;font-weight:500;color:var(--muted);padding-bottom:4px}
.jp-card-copy{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}.jp-card-title{font-size:20px;line-height:1.35;font-weight:750;overflow-wrap:anywhere}.jp-card-usage{font-size:14px;line-height:1.5;color:var(--muted)}
.jp-badge{flex-shrink:0;padding:3px 9px;border-radius:999px;background:var(--accent);color:#fff;font-size:13px;font-weight:700}
.jp-chevron{flex-shrink:0;width:9px;height:9px;border-right:2px solid var(--muted);border-top:2px solid var(--muted);transform:rotate(45deg);margin-right:4px}
.jp-empty{color:var(--muted)}
/* Bottom sheet, same as the itinerary site. */
dialog{color:#20383d}.bottom-sheet{position:fixed;inset:auto auto 0 50%;transform:translateX(-50%) translateY(var(--sheet-drag,0px));margin:0;width:min(100%,680px);max-width:100vw;height:88dvh;max-height:88dvh;border:0;border-radius:22px 22px 0 0;padding:0;overflow:hidden;box-shadow:0 -8px 50px #092c3026;transition:transform .18s ease}.bottom-sheet[open]{display:flex;flex-direction:column;animation:sheet-enter .2s ease-out}.bottom-sheet::backdrop{background:#102d3266}.bottom-sheet.is-dragging{transition:none;animation:none;user-select:none}
.sheet-header{flex-shrink:0;padding:10px 22px 14px;border-bottom:1px solid var(--line);background:#fff;touch-action:none}.sheet-header button{touch-action:manipulation}.sheet-handle{width:38px;height:4px;border-radius:4px;background:#c5d3d5;margin:0 auto 13px}.dialog-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.sheet-header h2{font-size:23px;line-height:1.4;margin:0;overflow-wrap:anywhere}
.sheet-close{flex:0 0 44px;display:grid;place-items:center;width:44px;height:44px;padding:10px;border:0;background:transparent;color:inherit;border-radius:50%}.sheet-close:hover{background:#f2f6f6}.sheet-close svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}.sheet-close:focus-visible{outline:none;background:#e8f2f1}
.sheet-body{flex:1;overflow-y:auto;overscroll-behavior:none;min-height:0;padding:20px 22px 24px}
@keyframes sheet-enter{from{transform:translate(-50%,70%);opacity:.6}to{transform:translate(-50%,0);opacity:1}}
@media(prefers-reduced-motion:reduce){.bottom-sheet{transition:none}.bottom-sheet[open]{animation:none}}
@media(max-width:640px){.jp-mark{flex-basis:76px;width:76px;height:76px;font-size:36px}.jp-card{gap:13px}.jp-card-title{font-size:19px}.sheet-header{padding-left:18px;padding-right:18px}.sheet-header h2{font-size:21px}.sheet-body{padding:18px}}
</style>
