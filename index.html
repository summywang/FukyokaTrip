<header><div class="wrap header-row"><div><h1>2027 九州親子旅行</h1></div><button id="open-notes" class="notebook-button" type="button" aria-label="開啟出發前筆記"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h12a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/><path d="M8 3v18M3 7h4M3 12h4M3 17h4M11 8h6M11 12h6M11 16h4"/></svg><span id="todo-badge" class="todo-badge" hidden></span></button></div></header>
<div class="navigation"><div class="wrap"><nav id="days" aria-label="切換每日行程"></nav></div></div>
<div id="page-scroll"><main class="wrap"><section id="itinerary" aria-label="當日行程"></section><div class="status-line"><span id="message" role="status"></span><button id="undo" class="plain" hidden>復原上一步</button></div><p id="storage-warning" role="status" class="muted"></p>
<section class="panel" id="collection" hidden><div class="panel-head"><h2>待安排 <span id="pending-count"></span></h2></div><p class="muted">把 Google 地圖的地點分享連結收在這裡，想好後再排成主行程或備選。</p><div id="places" class="place-grid"></div><div id="scheduled-count" class="scheduled-count"></div></section>
<footer>收藏、行程與筆記保存在目前瀏覽器，不會自動同步到 Google 地圖或其他裝置。可匯出備份，交給家人匯入。<div class="backup-bar"><button id="export" class="plain">匯出行程</button><button id="import" class="plain">匯入行程</button><input type="file" id="import-file" accept="application/json,.json" hidden></div></footer></main></div>
<button id="add-place" hidden class="add-place-fab" type="button" aria-label="收藏新地點"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
<dialog id="notes-sheet" class="bottom-sheet" aria-labelledby="notes-title"><div class="sheet-header"><div class="sheet-handle" aria-hidden="true"></div><div class="dialog-head"><h2 id="notes-title">出發前筆記</h2><button type="button" class="sheet-close" data-close="notes-sheet" aria-label="關閉出發前筆記"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div></div><div class="sheet-body notes-body"><div class="notes-toolbar"><div class="notes-tabs" role="group" aria-label="筆記分類"><button type="button" id="notes-active" aria-pressed="true">筆記 <span id="notes-active-count"></span></button><button type="button" id="notes-archived" aria-pressed="false">已封存 <span id="notes-archived-count"></span></button></div><button type="button" class="primary add-note" id="add-note">＋ 新增</button></div><p class="notes-hint" id="notes-hint">右滑編輯・左滑封存。</p><div id="note-list" class="note-list" aria-label="筆記清單"></div></div></dialog>
<dialog id="note-editor" class="bottom-sheet" aria-labelledby="note-editor-title"><form id="note-form" class="note-editor-form"><div class="sheet-header"><div class="sheet-handle" aria-hidden="true"></div><div class="dialog-head"><h2 id="note-editor-title">新增筆記</h2><button type="button" class="sheet-close" data-close="note-editor" aria-label="關閉筆記編輯"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div></div><div class="sheet-body"><label class="field">標題<input id="note-title" required maxlength="180" placeholder="例如：想買的伴手禮"></label><label class="field">內容<textarea id="note-body" maxlength="8000" placeholder="想記下的事情，都可以寫在這裡。"></textarea></label><p id="note-error" class="form-error" role="alert"></p></div><div class="sheet-actions"><button type="submit" class="primary">儲存筆記</button></div></form></dialog>
<dialog id="slot-sheet" class="bottom-sheet" aria-labelledby="slot-sheet-title"><div class="sheet-header"><div class="sheet-handle" aria-hidden="true"></div><div class="dialog-head"><h2 id="slot-sheet-title"></h2><button type="button" class="sheet-close" data-close="slot-sheet" aria-label="關閉行程詳情"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div></div><div id="slot-sheet-body" class="sheet-body"></div><div id="slot-sheet-actions" hidden class="sheet-actions"></div></dialog>
<dialog id="place-dialog"><form id="place-form"><div class="dialog-head"><h2 id="place-dialog-title">收藏新地點</h2><button type="button" class="plain" data-close="place-dialog">關閉</button></div><label class="field">Google 地圖分享連結<input id="place-url" type="url" required maxlength="8192" placeholder="https://maps.app.goo.gl/…"></label><label class="field">地點名稱<input id="place-title" maxlength="180" placeholder="例如：想吃的拉麵店"></label><label class="field">備註<textarea id="place-note" maxlength="8000" placeholder="想吃什麼、要注意的事，或先當作備選"></textarea></label><p class="muted">短連結可能無法帶出名稱，可以自行填寫。收藏不需要登入 Google 或提供 API 金鑰。</p><p id="place-error" class="form-error" role="alert"></p><div class="form-actions"><button class="primary" type="submit">存入待安排</button></div></form></dialog>
<dialog id="schedule-dialog"><form id="schedule-form"><div class="dialog-head"><h2 id="schedule-title">排入行程</h2><button type="button" class="plain" data-close="schedule-dialog">關閉</button></div><label class="field">日期<select id="schedule-day"></select></label><label class="field">安排方式<select id="schedule-mode"><option value="main">主行程</option><option value="alternative">某段行程的備選</option></select></label><label class="field" id="schedule-time-field">時間（日本時間；台灣時段請加註）<input id="schedule-time" maxlength="80" placeholder="例如：12:00–13:00；未決定可留白"></label><label class="field"><span id="schedule-position-label">接在哪一段之後</span><select id="schedule-position"></select></label><p id="schedule-error" class="form-error" role="alert"></p><div class="form-actions"><button type="submit" class="primary">確認安排</button></div></form></dialog>
<dialog id="edit-dialog"><form id="edit-form"><div class="dialog-head"><h2>編輯行程</h2><button type="button" class="plain" data-close="edit-dialog">關閉</button></div><label class="field">行程名稱<input id="edit-title" required maxlength="180"></label><label class="field">日期<select id="edit-day"></select></label><label class="field" id="edit-time-field">時間<input id="edit-time" maxlength="80"></label><fieldset id="edit-flight-fields" hidden><legend>航班資訊（各地時間）</legend><label class="field">航班編號<input id="edit-flight-number" maxlength="20"></label><div class="flight-edit-times"><label class="field"><span id="edit-flight-from-label">出發時間</span><input type="time" id="edit-flight-from"></label><label class="field"><span id="edit-flight-to-label">抵達時間</span><input type="time" id="edit-flight-to"></label></div></fieldset><label class="field" id="edit-kind-field">行程類型<select id="edit-kind"><option value="activity">一般行程</option><option value="transport">交通／車程</option></select></label><label class="field">Google 地圖連結<input id="edit-url" type="url" maxlength="8192"></label><label class="field">備註<textarea id="edit-note" maxlength="8000"></textarea></label><p class="muted">起訖時間會自動換算停留時間；改日期會移到該日最後一段。</p><p id="edit-error" class="form-error" role="alert"></p><div class="form-actions"><button type="submit" class="primary">儲存修改</button></div></form></dialog>
<dialog id="viewer"><div class="dialog-head"><h2 id="image-title"></h2><button type="button" class="plain" data-close="viewer">關閉</button></div><div id="full-image" class="viewer-photo"></div><p id="image-credit" class="viewer-credit"></p></dialog>
</body></html>
